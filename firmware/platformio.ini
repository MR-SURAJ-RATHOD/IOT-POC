; ---------------------------------------------------------------------------
; Host unit tests (no ESP32 hardware)
; ---------------------------------------------------------------------------

[env:native]
platform = native
test_framework = unity
test_build_src = false
lib_ldf_mode = chain
lib_extra_dirs =
    ../controllers
    ../sensors
    ../communication
    ../cellular/quectel
    ../mqtt
    ../rtos
lib_ignore =
    esp32_hal
    digital_io
    mqtt_client_esp
build_src_filter = -<*>
build_flags =
    -I include
    -DIOTPOC_NATIVE=1
    -DUNITY_INCLUDE_DOUBLE
    -std=c++11
