; PlatformIO workspace for the Embedded & IoT Proof-of-Concept Reference.
; src_dir is the repository root so each environment can select one example/POC folder.
; Libraries live in domain folders via lib_extra_dirs (not a monolith firmware/src tree).

[platformio]
default_envs = poc_relay_control
src_dir = ..
include_dir = include
test_dir = ../tests/native
description = Embedded and IoT Proof-of-Concept Reference (ESP32)

[esp32_common]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain
lib_extra_dirs =
    ../controllers
    ../sensors
    ../communication
    ../cellular/quectel
    ../mqtt
    ../rtos
build_flags =
    -I include
    -DIOTPOC_PLATFORM_ESP32=1

; ---------------------------------------------------------------------------
; Composed POCs
; ---------------------------------------------------------------------------

[env:poc_relay_control]
extends = esp32_common
build_src_filter = -<*> +<poc/relay_control/>

[env:poc_sensor_telemetry]
extends = esp32_common
build_src_filter = -<*> +<poc/sensor_telemetry/>
lib_deps =
    knolleary/PubSubClient@2.8.0

[env:poc_cellular_data_path]
extends = esp32_common
build_src_filter = -<*> +<poc/cellular_data_path/>

[env:poc_command_and_control]
extends = esp32_common
build_src_filter = -<*> +<poc/command_and_control/>
lib_deps =
    knolleary/PubSubClient@2.8.0

