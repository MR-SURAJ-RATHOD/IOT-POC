<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-label="MQTT data flow">
  <title>MQTT data flow</title>
  <rect x="20" y="30" width="140" height="40" fill="none" stroke="currentColor"/>
  <text x="90" y="55" text-anchor="middle">SensorReading</text>
  <rect x="200" y="30" width="150" height="40" fill="none" stroke="currentColor"/>
  <text x="275" y="55" text-anchor="middle">JSON telemetry</text>
  <rect x="390" y="80" width="140" height="40" fill="none" stroke="currentColor"/>
  <text x="460" y="105" text-anchor="middle">MqttClient</text>
  <rect x="580" y="20" width="150" height="40" fill="none" stroke="currentColor"/>
  <text x="655" y="45" text-anchor="middle">Wi-Fi / AT-MQTT</text>
  <rect x="580" y="80" width="150" height="40" fill="none" stroke="currentColor"/>
  <text x="655" y="105" text-anchor="middle">LWT / retain</text>
  <rect x="20" y="130" width="140" height="40" fill="none" stroke="currentColor"/>
  <text x="90" y="155" text-anchor="middle">cmd / cfg</text>
  <rect x="200" y="130" width="150" height="40" fill="none" stroke="currentColor"/>
  <text x="275" y="155" text-anchor="middle">Command parser</text>
  <path d="M160 50 H200" stroke="currentColor"/>
  <path d="M350 50 H460 50 V80" stroke="currentColor" fill="none"/>
  <path d="M530 100 H580" stroke="currentColor"/>
  <path d="M160 150 H200" stroke="currentColor"/>
  <path d="M350 150 H460 150 V120" stroke="currentColor" fill="none"/>
</svg>
