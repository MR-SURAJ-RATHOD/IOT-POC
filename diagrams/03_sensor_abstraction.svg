  <rect x="440" y="160" width="140" height="40" fill="none" stroke="currentColor"/>
  <text x="510" y="185" text-anchor="middle">UART RS-485 HAL</text>
  <path d="M140 115 H200" stroke="currentColor"/>
  <path d="M360 80 H440" stroke="currentColor"/>
</svg>
